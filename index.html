<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Cẩm nang dịch vụ công Quỳ Hợp</title>

  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Giao diện chuẩn phong cách Vue của Docsify -->
<link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

<!-- Giao diện thu gọn/mở rộng menu bên trái -->
<link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />

<!-- Giao diện cho plugin sáng/tối -->
<link rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css"
      title="docsify-darklight-theme"
      type="text/css">

</head>
<body>

  <div id="app">Đang tải dữ liệu hệ thống...</div>

  <script>
    window.$docsify = {
  name: 'Cẩm nang dịch vụ công Quỳ Hợp',
  repo: '',
  loadSidebar: true,
  subMaxLevel: 0,
  search: 'auto',
  sidebarDisplayLevel: 1
}
  </script>

  <!-- Thư viện mã nguồn mở Docsify -->
<script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

<!-- Plugin tìm kiếm thông minh -->
<script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

<!-- Plugin nút sao chép mã -->
<script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>

<!-- Plugin đếm số chữ và thời gian đọc -->
<script src="//cdn.jsdelivr.net/npm/docsify-count/dist/countable.min.js"></script>

<!-- Plugin thu gọn/mở rộng menu bên trái -->
<script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>

<!-- Plugin chuyển đổi giao diện sáng/tối -->
<script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>

</body>
</html>
